<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#259033" />
    <title>ZAPPO — Tenorra Labs</title>
    <style>
        @font-face {
            font-family: "Neue Montreal";
            src: url("neue-montreal-font-family/NeueMontreal-Regular.otf") format("opentype");
            font-weight: 400;
        }

        @font-face {
            font-family: "Neue Montreal";
            src: url("neue-montreal-font-family/NeueMontreal-Bold.otf") format("opentype");
            font-weight: 800;
        }

        :root {
            --green: #259033;
            --cream: #f4f1e8;
            --ink: #10130f;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            background: var(--green);
            color: var(--cream);
        }

        body {
            font-family: "Neue Montreal", sans-serif;
            overflow-x: hidden;
        }

        .zappo-page {
            min-height: 320vh;
        }

        .zappo-stage {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
        }

        .zappo-nav {
            position: absolute;
            inset: 0 0 auto;
            z-index: 3;
            display: flex;
            justify-content: space-between;
            padding: 28px 4vw;
            font-size: 13px;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .zappo-nav a {
            color: inherit;
            text-decoration: none;
        }

        .zappo-intro {
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 4vw;
            width: min(31vw, 430px);
            transform: translateY(-50%);
        }

        .zappo-kicker {
            margin: 0 0 24px;
            font-size: 12px;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(62px, 11vw, 180px);
            line-height: .78;
            letter-spacing: -.07em;
            text-transform: uppercase;
        }

        .zappo-summary {
            max-width: 330px;
            margin: 34px 0 0;
            font-size: clamp(18px, 1.7vw, 25px);
            line-height: 1.08;
        }

        .zappo-meta {
            display: flex;
            gap: 28px;
            margin-top: 44px;
            font-size: 11px;
            letter-spacing: .14em;
            line-height: 1.45;
            text-transform: uppercase;
        }

        .zappo-meta span {
            display: block;
            opacity: .62;
        }

        .zappo-reel {
            position: absolute;
            top: 50%;
            left: 48%;
            display: flex;
            gap: 3vw;
            width: max-content;
            transform: translate3d(var(--reel-x, 0px), -50%, 0);
            will-change: transform;
        }

        .zappo-card {
            width: min(58vw, 820px);
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: var(--ink);
            flex: 0 0 auto;
        }

        .zappo-card img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .zappo-card:nth-child(2) img {
            object-position: 50% 34%;
            transform: scale(1.08);
        }

        .zappo-card:nth-child(3) img {
            object-position: 50% 68%;
            transform: scale(1.08);
        }

        .zappo-footer {
            position: absolute;
            z-index: 3;
            right: 4vw;
            bottom: 28px;
            font-size: 12px;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        @media (max-width: 700px) {
            .zappo-nav {
                padding: 20px;
            }

            .zappo-stage {
                height: 100svh;
            }

            .zappo-intro {
                top: 18%;
                left: 20px;
                width: calc(100% - 40px);
                transform: none;
            }

            h1 {
                font-size: clamp(62px, 22vw, 120px);
            }

            .zappo-summary {
                max-width: 260px;
                margin-top: 26px;
                font-size: 18px;
            }

            .zappo-meta {
                margin-top: 25px;
            }

            .zappo-reel {
                top: auto;
                bottom: 12%;
                left: 20px;
                gap: 20px;
                transform: translate3d(var(--reel-x, 0px), 0, 0);
            }

            .zappo-card {
                width: 82vw;
            }

            .zappo-footer {
                right: 20px;
                bottom: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .zappo-page {
                min-height: 100vh;
            }

            .zappo-reel {
                transform: translate3d(0, -50%, 0);
            }
        }
    </style>
</head>

<body>
    <main class="zappo-page">
        <section class="zappo-stage" aria-label="ZAPPO project case study">
            <nav class="zappo-nav"><a href="index.html#works">Back to work</a><span>Tenorra Labs · 2025</span></nav>
            <div class="zappo-intro">
                <p class="zappo-kicker">Software Engineer Intern</p>
                <h1>ZAPPO</h1>
                <p class="zappo-summary">Building a sharper way to discover, book and share the game.</p>
                <div class="zappo-meta">
                    <div><span>Role</span>Engineering</div>
                    <div><span>Focus</span>Product design</div>
                </div>
            </div>
            <div class="zappo-reel" data-zappo-reel>
                <figure class="zappo-card"><img src="assets/images/zappo.jpeg" alt="ZAPPO sports community interface" />
                </figure>
                <figure class="zappo-card"><img src="assets/images/zappo.jpeg" alt="ZAPPO sports community interface" />
                </figure>
                <figure class="zappo-card"><img src="assets/images/zappo.jpeg" alt="ZAPPO sports community interface" />
                </figure>
            </div>
            <div class="zappo-footer">Scroll to explore ↘</div>
        </section>
    </main>
    <script>
        (() => {
            const reel = document.querySelector("[data-zappo-reel]");
            if (!reel || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
            const update = () => {
                const range = Math.max(1, document.documentElement.scrollHeight - innerHeight);
                const progress = Math.min(1, Math.max(0, scrollY / range));
                reel.style.setProperty("--reel-x", `${-progress * (reel.scrollWidth - innerWidth * 0.52)}px`);
            };
            addEventListener("scroll", update, { passive: true });
            addEventListener("resize", update);
            update();
        })();
    </script>
</body>

</html>
